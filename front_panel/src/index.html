<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Watch Dog</title>
        <link
            rel="preload"
            href="/fonts/deco/JosefinSans-Variable.ttf"
            as="font"
            type="font/ttf"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/deco/Limelight-Regular.ttf"
            as="font"
            type="font/ttf"
            crossorigin
        />
        <link rel="stylesheet" href="/css/deco.css" />
        <link rel="stylesheet" href="/css/control_window_style.css" />
        <link rel="stylesheet" href="/css/chart_style.css" />
        <link rel="stylesheet" href="/css/portals.css" />
        <link rel="icon" href="/favicon.png" type="image/png" />
    </head>
    <body>
        <div class="container">
            <aside class="col-left section deco-panel" aria-label="Processor and temperature">
                <div id="cpu-cluster"></div>
                <div id="temp-cluster"></div>
            </aside>
            <main class="col-center">
                <div class="deco-crest" aria-hidden="true"></div>
                <div class="vitals-row deco-panel" aria-label="Memory and network">
                    <div id="ram-gauge"></div>
                    <div id="net-down-gauge"></div>
                    <div id="net-up-gauge"></div>
                </div>
                <section
                    class="display deco-panel plaque"
                    data-plaque="specifications"
                    aria-label="System specifications"
                ></section>
                <section
                    class="display_2 deco-panel plaque"
                    data-plaque="teleprinter"
                    aria-label="Teleprinter"
                ></section>
                <section
                    class="control2 deco-panel plaque"
                    data-plaque="controls"
                    aria-label="Controls"
                >
                    <div class="cover" aria-hidden="true">
                        <div class="gate gate-left"></div>
                        <div class="gate gate-right"></div>
                    </div>
                    <canvas
                        id="control2"
                        aria-label="Control panel with three switches and three buttons"
                    ></canvas>
                </section>
            </main>
            <aside class="col-right section deco-panel" aria-label="Storage">
                <div id="storage-cluster"></div>
            </aside>
        </div>
    </body>
</html>
